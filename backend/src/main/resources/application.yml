# All environment-specific values come from environment variables (CLAUDE.md §1.10).
# Profiles: dev (local), prod, test. Defaults here are shared; secrets have no usable default.
#
# Load ./.env (KEY=VALUE) when present so local runs need no exported variables. Real environment
# variables still win (higher precedence). Never under the test profile: tests must not depend on
# whose laptop they ran on.
spring:
  config:
    activate:
      on-profile: "!test"
    import: "optional:file:./.env[.properties]"
---
spring:
  application:
    name: manageedocs
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/manageedocs?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectionTimeZone=UTC}
    username: ${DB_USERNAME:manageedocs}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate            # schema is owned by Flyway, never by Hibernate
    properties:
      hibernate:
        # Discriminator multi-tenancy (ADR-004): tenant comes from the authenticated principal.
        tenant_identifier_resolver: com.manageedocs.tenancy.TenantIdentifierResolver
        type:
          # Map Instant to DATETIME(6) (stored as UTC) instead of TIMESTAMP_UTC.
          preferred_instant_jdbc_type: TIMESTAMP
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
  flyway:
    enabled: true
    # Vendor-partitioned like the reference platform; MySQL is the only supported engine today.
    locations: classpath:db/migration/{vendor}
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:100MB}
      max-request-size: ${UPLOAD_MAX_FILE_SIZE:100MB}

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  server:
    # Health/metrics off the public port (reference platform convention).
    port: ${MANAGEMENT_PORT:8079}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs

manageedocs:
  security:
    # HS256 key, >= 32 bytes. Dev default is deliberately obvious; startup fails in prod profile if unchanged.
    jwt-secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789abcdef}
    access-token-ttl: ${JWT_ACCESS_TTL:PT10M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P7D}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    max-failed-logins: 5
    lockout-duration: PT15M
    cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    bucket: ${STORAGE_BUCKET:manageedocs}
    path-style: ${STORAGE_PATH_STYLE:true}
    download-url-ttl: ${STORAGE_DOWNLOAD_TTL:PT5M}
  documents:
    max-file-size-bytes: ${DOCUMENT_MAX_BYTES:104857600}
    lock-duration: ${DOCUMENT_LOCK_DURATION:PT8H}
  processing:
    poller-enabled: ${PROCESSING_POLLER_ENABLED:true}
    poll-interval: ${PROCESSING_POLL_INTERVAL:PT5S}
    batch-size: ${PROCESSING_BATCH_SIZE:10}
    claim-timeout: ${PROCESSING_CLAIM_TIMEOUT:PT10M}
    max-attempts: ${PROCESSING_MAX_ATTEMPTS:5}
    retry-base: ${PROCESSING_RETRY_BASE:PT30S}
    max-extracted-chars: ${PROCESSING_MAX_TEXT_CHARS:2000000}
    clamav-host: ${CLAMAV_HOST:}
    clamav-port: ${CLAMAV_PORT:3310}
    clamav-timeout: ${CLAMAV_TIMEOUT:PT60S}
    orphan-age: ${STORAGE_ORPHAN_AGE:PT1H}
  records:
    # Day boundaries for "today's dispatches", due dates and monthly reports.
    time-zone: ${RECORDS_TIME_ZONE:Africa/Nairobi}
    overdue-check-enabled: ${RECORDS_OVERDUE_CHECK_ENABLED:true}
    overdue-cron: ${RECORDS_OVERDUE_CRON:0 0 8 * * *}

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
