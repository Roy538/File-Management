# All environment-specific values come from environment variables (CLAUDE.md §1.10).
# Defaults below are safe for local development only; production MUST override secrets.
spring:
  application:
    name: manageedocs
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/manageedocs?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectionTimeZone=UTC}
    username: ${DB_USERNAME:manageedocs}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate            # schema is owned by Flyway, never by Hibernate
    properties:
      hibernate:
        # Discriminator multi-tenancy (ADR-004): tenant comes from the authenticated principal.
        tenant_identifier_resolver: com.manageedocs.tenancy.TenantIdentifierResolver
        type:
          # Map Instant to DATETIME(6) (stored as UTC) instead of TIMESTAMP_UTC.
          preferred_instant_jdbc_type: TIMESTAMP
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:100MB}
      max-request-size: ${UPLOAD_MAX_FILE_SIZE:100MB}

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs

manageedocs:
  security:
    # HS256 key, >= 32 bytes. Dev default is deliberately obvious; startup fails in prod profile if unchanged.
    jwt-secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789abcdef}
    access-token-ttl: ${JWT_ACCESS_TTL:PT10M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P7D}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    max-failed-logins: 5
    lockout-duration: PT15M
    cors-origins: ${CORS_ORIGINS:http://localhost:5173}

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
---
spring:
  config:
    activate:
      on-profile: dev
manageedocs:
  security:
    refresh-cookie-secure: false
